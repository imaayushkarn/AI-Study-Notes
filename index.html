<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Study Notes Generator</title>
    <style>
        :root {
            --primary: #4f46e5; /* Purple-Blue */
            --secondary: #7c3aed; /* Purple */
            --bg: #f8fafc; /* White/Light Gray */
            --text: #1e293b;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            color: var(--primary);
            text-align: center;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 600px;
        }
        textarea {
            width: 100%;
            height: 150px;
            padding: 10px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            margin-bottom: 15px;
            font-family: inherit;
        }
        .file-upload {
            margin-bottom: 20px;
            padding: 10px;
            border: 2px dashed var(--secondary);
            border-radius: 8px;
            text-align: center;
        }
        button {
            background: linear-gradient(to right, var(--primary), var(--secondary));
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: opacity 0.2s;
        }
        button:hover {
            opacity: 0.9;
        }
        #loading {
            display: none;
            text-align: center;
            margin-top: 20px;
            color: var(--primary);
            font-weight: bold;
        }
        #result {
            margin-top: 30px;
            width: 100%;
            max-width: 800px;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            display: none;
        }
        #result h2 {
            color: var(--secondary);
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 8px;
        }
    </style>
</head>
<body>

    <h1>AI Study Notes Generator 🚀</h1>
    
    <div class="container">
        <form id="uploadForm">
            <div class="file-upload">
                <label for="pdfFile"><strong>Upload PDF Material:</strong></label><br><br>
                <input type="file" id="pdfFile" accept=".pdf">
            </div>
            
            <p style="text-align: center; font-weight: bold;">OR</p>
            
            <label for="textInput"><strong>Paste your text here:</strong></label>
            <textarea id="textInput" placeholder="Paste your study material, articles, or notes here..."></textarea>
            
            <button type="submit">Generate Magic Notes ✨</button>
        </form>
        
        <div id="loading">AI is reading your material... This takes about 10-20 seconds. ⏳</div>
    </div>

    <div id="result">
        <!-- AI output will appear here -->
    </div>

    <script>
        document.getElementById('uploadForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const pdfFile = document.getElementById('pdfFile').files[0];
            const textInput = document.getElementById('textInput').value;
            const loading = document.getElementById('loading');
            const resultDiv = document.getElementById('result');
            
            if (!pdfFile && !textInput.trim()) {
                alert("Please upload a PDF or paste some text!");
                return;
            }

            // Show loading
            loading.style.display = 'block';
            resultDiv.style.display = 'none';

            const formData = new FormData();
            if (pdfFile) formData.append('file', pdfFile);
            if (textInput) formData.append('text', textInput);

            try {
                const response = await fetch('/api/generate', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                if (data.error) {
                    alert("Error: " + data.error);
                } else {
                    resultDiv.innerHTML = data.result;
                    resultDiv.style.display = 'block';
                }
            } catch (err) {
                alert("Something went wrong! Please try again.");
            } finally {
                loading.style.display = 'none';
            }
        });
    </script>
</body>
</html>
